<!DOCTYPE html>
<html>
<head>
<title>PS4 7.00 - 13.00 FW GoldHEN Host by محمود أبو بلال</title>
  <script>
        // Проверка статуса кэша (остается в head, это правильно)
        if (window.applicationCache && window.applicationCache.status === 0) {
            window.location.replace("cache900.html");
		}
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
	/* تثبيت الصفحة ومنع الـ Scroll */
	html, body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background-color: #24272b;
		color: white;
		text-align: center;
		font-family: sans-serif;
	}

	/* خلفية الصورة بثبات تام على أي شاشة وبلايستيشن */
	.bg-image {
		position: fixed;
		top: 0;
		left: 0;
		width: 100vw;
		height: 100vh;
		object-fit: cover;
		z-index: -1; /* عشان تفضل وراء كل العناصر */
	}

	/* محتوى الصفحة عشان يظهر فوق الصورة بوضوح */
	.content {
		position: relative;
		z-index: 1;
		width: 100%;
		height: 100%;
		box-sizing: border-box;
		padding: 20px;
	}

	h1 {
		text-shadow: 0.1em 0.1em 0.2em black;
		font-size: 25px;
		color: white;
	}
	a {
		text-decoration: none;
	}
	#progress, #menu {
		display: block;
	}
	#crypto, #tools, #lnx, #mods {
		display: none;
	}
	.btn {
		background-color: #003263;
		color: white;
		width: 240px;
		height: 40px;
		padding-bottom: 5px;
		text-align: center;
		font-size: 20px;
		margin-top: 8px;
		margin-bottom: 8px;
		margin-left: 5px;
		margin-right: 5px;
		border-style: none;
		transition-duration: 0.4s;
		cursor: pointer;
		border-radius: 4px;
	}
	.btn:hover {
		background-color: #0069d9;
	}
	.btn-onln {
		background-color: #076300;
	}
	.btn-onln:hover {
		background-color: #18891b;
	}
	.btn-toolbox {
		background-color: #ae2301;
	}
	.btn-toolbox:hover {
		background-color: #d42a01;
	}
	.btn-ps5 {
		background-color: #3d3f4e;
	}
	.btn-ps5:hover {
		background-color: #c2c2c2;
		color: #303030;
	}
  </style>
</head>
<body>

<!-- الصورة الخلفية مستقلة عشان تظبط مقاساتها على البلايستيشن بدقة -->
<img src="img.jpg" class="bg-image" alt="Background">

<div class="content">
	<h1>PS4 7.00 - 13.00 FW GoldHEN Host by محمود أبو بلال</h1>
	<hr>
	<br>
	<h1 id="msgs" style="font-size: 30px;margin-top: 77px;margin-bottom: 455px;">Loading GoldHEN v2.4b18.10... Please Wait</h1>
</div>

<script>
	// Принудительно регистрируем элемент в глобальной области видимости window
	window.msgs = document.getElementById('msgs');

	function sleep(ms = 0) {
		return new Promise(resolve => setTimeout(resolve, ms));
	}

	window.addEventListener('load', async function () {
		try {
			if (window.msgs) window.msgs.innerHTML = "Ожидание стабилизации памяти (5с)...";
			
			// Стабилизируем память браузера PS4 (очень важно для PSFree)
			await sleep(5000);

			if (window.msgs) window.msgs.innerHTML = "Запуск эксплойта WebKit...";

			// Толкаем первую доминошку в цепочке импортов
			import('./900/alert.js'); 
		} catch (err) {
			alert("Критический сбой инициализации хоста!\n" + err.message);
		}
	});
</script>
</body>
</html>
