<!-- Исправлено: добавлены кавычки для id -->
<h1 id="msgs" style="font-size: 30px;margin-top: 77px;margin-bottom: 455px;">Starting Cache Installation...</h1>
<>

<script>
// Принудительно регистрируем элемент msgs в памяти
window.msgs = document.getElementById('msgs');

// Очистка истории браузера PS4 (чтобы страница не "залипала" при возврате назад)
try {
    history.replaceState(null, null, 'index.html');
    var histlength = history.length;
    history.go(-histlength);
} catch(e) {}

function DLProgress(e) {
    if (e.loaded && e.total) {
        var Percent = (Math.round(e.loaded / e.total * 100));
        if (window.msgs) window.msgs.innerHTML = "Installing Offline Cache: " + Percent + "%";
    }
}

function DisplayCacheProgress() {
    if (window.msgs) window.msgs.innerHTML = "Cache Installed Successfully ✔";
    setTimeout(function() {
        if (window.msgs) window.msgs.innerHTML = "Now Close And Re-Open Your Browser ...";
    }, 1500);
}

// Предохранитель &&: вешаем события кэширования только если они поддерживаются устройством
if (window.applicationCache) {
    window.applicationCache.addEventListener("progress", DLProgress, false);
    window.applicationCache.oncached = function(e) { DisplayCacheProgress(); };
    window.applicationCache.onupdateready = function(e) { DisplayCacheProgress(); };
    window.applicationCache.onerror = function(e) { 
        if (window.msgs) window.msgs.innerHTML = "Error Installing Cache! - Clear and Re-Open Your Browser ...";
    };
}
</script>
</body>
